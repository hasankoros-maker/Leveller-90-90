name: Build and release Geode mod

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win32
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Geode package
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          sdk: given
          cli: latest
          bindings-ref: 2702254eb336901fae864388c887d820a776d87b
          target: ${{ matrix.config.target }}

  package:
    name: Combine platform packages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: leveller-geode
          path: ${{ steps.build.outputs.build-output }}

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: leveller-geode
          path: dist
      - name: Create release and upload .geode
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.geode
